<footer>
  <button id="changeBg">Change Background</button>

  <script>
    const bg = ["city.jpg", "funkyshapes.jpg", "monterey.jpg"];

  let bgIndex = 0;

  const savedIndex = localStorage.getItem("bgIndex");
  if (savedIndex !== null) {
    bgIndex = parseInt(savedIndex, 10);}

  document.body.style.backgroundImage = `url(${bg[bgIndex]})`;

  document.getElementById("changeBg").addEventListener("click", () => {
    bgIndex = (bgIndex + 1) % bg.length;

    document.body.style.backgroundImage = `url(${bg[bgIndex]})`;

    localStorage.setItem("bgIndex", bgIndex);});
  </script>
